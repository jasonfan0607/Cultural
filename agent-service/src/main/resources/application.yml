server:
  address: ${AGENT_BIND_ADDRESS:127.0.0.1}
  port: ${AGENT_PORT:8081}
spring:
  application:
    name: cultural-agent
  config:
    import: optional:file:./application-local.yml
  mvc:
    async:
      request-timeout: 180000
agent:
  backend-url: ${CULTURAL_BACKEND_URL:http://127.0.0.1:8080/api}
  deepseek-key: ${DEEPSEEK_API_KEY:}
  deepseek-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-flash}
  thinking: ${DEEPSEEK_THINKING:false}
  image-key: ${VOLCENGINE_API_KEY:}
  image-url: ${VOLCENGINE_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
  image-model: ${VOLCENGINE_MODEL:doubao-seedream-5-0-260128}
  max-rounds: 6
  max-tool-calls: 10
  max-output-tokens: 4096
  max-context-chars: 100000
  timeout-seconds: 150
  session-ttl-minutes: 30
  max-sessions: 500
  requests-per-minute: 10
logging:
  level:
    com.cultural.agent: INFO
search:
  cache-file: ${SEARCH_CACHE_FILE:./data/search-cache.json}
  serpapi-key: ${SERPAPI_API_KEY:}
  engine: ${WEB_SEARCH_ENGINE:google}
